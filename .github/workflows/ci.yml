name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Lint (ESLint, zero-tolerance)
        run: npm run lint

      - name: Secret scan (no credentials in repo)
        run: npm run secrets

      - name: End-to-end (headless Chrome, best effort)
        run: node tests/selenium.js
        env:
          SELENIUM_HEADLESS: "1"
        continue-on-error: true

      - name: Dependency audit (fails only on high/critical)
        run: npm run audit

      - name: Mobile viewport (headless Chrome, best effort)
        run: node tests/mobile.js
        env:
          SELENIUM_HEADLESS: "1"
        continue-on-error: true

      - name: Upload visual-regression artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression
          path: tests/screenshots/
          if-no-files-found: ignore

      - name: Lighthouse budget (best effort)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:8080/timeline.html
          startServerCommand: npx http-server . -p 8080 -s
          budgetPath: ./.lighthouse-budget.json
        continue-on-error: true
